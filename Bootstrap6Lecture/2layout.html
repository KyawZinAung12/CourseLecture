<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h1 class="text-center">Layout Lesson</h1>

    <div class="container bg-primary py-3 my-3 text-center">
        Container
    </div>
    <div class="sm:container bg-primary py-3 my-3 text-center">
        Container SM
    </div>
    <div class="md:container bg-primary py-3 my-3 text-center">
        Container MD
    </div>
    <div class="lg:container bg-primary py-3 my-3 text-center">
        Container LG
    </div>
    <div class="xl:container bg-primary py-3 my-3 text-center">
        Container XL
    </div>
    <div class="xxl:container bg-primary py-3 my-3 text-center">
        Container XXL
    </div>
    <div class="container-fluid bg-primary py-3 my-3 text-center">
        Container Fluid
    </div>
</body>
</html>
