<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body data-bs-theme="light">

    <div id="carouselStackedBottom" class="carousel slide carousel-fade" data-bs-autoplay="true">
        <!-- <div class="d-flex justify-content-end align-items-center">
            <div>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedBottom" data-bs-slide="prev">
                    <span class="carousel-icon-prev"></span>
                </button>
                <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedBottom" data-bs-slide="next">
                    <span class="carousel-icon-next"></span>
                </button>
            </div>
        </div> -->        
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/carousel1.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/carousel2.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/carousel3.png" class="d-block w-100" alt="...">
            </div>
        </div>
        <!-- <div>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedBottom" data-bs-slide="prev">
                <span class="carousel-icon-prev"></span>
            </button>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedBottom" data-bs-slide="next">
                <span class="carousel-icon-next"></span>
            </button>
        </div> -->
    </div>

    <div id="carouselStackedIndicators" class="carousel carousel-overlay slide auto" data-bs-autoplay="true">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/carousel1.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/carousel2.png" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="images/carousel3.png" class="d-block w-100" alt="...">
            </div>
        </div>
        <div class="carousel-overlay-controls">
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators"
                data-bs-slide="prev">
                <span class="carousel-icon-prev"></span>
            </button>
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselStackedIndicators" data-bs-slide-to="2"></button>
            </div>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicators"
                data-bs-slide="next">
                <span class="carousel-icon-next"></span>
            </button>
        </div>
    </div>


    <div id="carouselStackedIndicator" class="carousel carousel-overlay slide auto" data-bs-autoplay="true">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/carousel1.png" class="d-block w-100" alt="...">
                <div class="slide-caption">
                    <h2>Start Your Career</h2>
                    <p>Take the next step in your career.</p>
                    <a href="#" class="btn btn-primary">Get Started</a>
                </div>
            </div>
            <div class="carousel-item">
                <img src="images/carousel2.png" class="d-block w-100" alt="...">
                <div class="slide-caption">
                    <h2>Advance Your Skills</h2>
                    <p>Enhance your skills with our comprehensive training programs.</p>
                    <a href="#" class="btn btn-primary">Learn More</a>
                </div>
            </div>
            <div class="carousel-item">
                <img src="images/carousel3.png" class="d-block w-100" alt="...">
                <div class="slide-caption">
                    <h2>Grow Your Network</h2>
                    <p>Connect with industry professionals and expand your network.</p>
                    <a href="#" class="btn btn-primary">Join Us</a>
                </div>
            </div>
        </div>
        <div class="carousel-overlay-controls">
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicator"
                data-bs-slide="prev">
                <span class="carousel-icon-prev"></span>
            </button>
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselStackedIndicator" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#carouselStackedIndicator" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#carouselStackedIndicator" data-bs-slide-to="2"></button>
            </div>
            <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselStackedIndicator"
                data-bs-slide="next">
                <span class="carousel-icon-next"></span>
            </button>
        </div>
    </div>

</body>

</html>
