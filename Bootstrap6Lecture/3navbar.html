<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body data-bs-theme="light">
    <nav class="navbar md:navbar-expand bg-1 shadow py-5">
        <div class="container">
            <a class="navbar-brand" href="#">Kyaw Fashion</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavAltMarkup">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- drawer top start bottom end -->
            <dialog class="drawer drawer-end" id="navbarNavAltMarkup">
                <div class="drawer-header">
                    <h5 class="drawer-title">Kyaw Fashion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav md:ms-auto">
                        <li class="nav-item">
                            <a class="nav-link ms-4 active" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ms-4" href="#">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ms-4" href="#">Service</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ms-4" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link ms-4" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>
</body>

</html>
