<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data Type</h1>

    <script>
        // string data type
        // let name = "Kyaw Zin Aung";
        // let name = 'Kyaw Zin Aung';
        let name = `Kyaw Zin Aung`;
        console.log(name);
        console.log(typeof(name));

        // numberic data type
        let age = 29;
        console.log(age);
        console.log(typeof(age));

        // bollen data type (true or false)
        let isStudent = true;
        console.log(isStudent);
        console.log(typeof(isStudent));

        // undefined data type
        let undefinedVariable;
        console.log(undefinedVariable);
        console.log(typeof(undefinedVariable));

        // null data type
        let nullVariable = null;
        console.log(nullVariable);
        console.log(typeof(nullVariable));

        // array data type index start from 0
        // let studentList = new Array('Mg Mg','Aung Aung','Hla Hla');
        let studentList = ['Mg Mg','Aung Aung','Hla Hla' ];

        console.log(studentList);
        console.log(typeof(studentList));
        console.log(studentList.length);
        console.log(studentList[2]);

        // object data type
        let student = {
            // key : value,
            name : "Kyaw Zin Aung",
            age : 29,
            address : "Myotha",
            education : "University of Computer Science (MDY)",

        }

        console.log(student);
        console.log(typeof(student));
        console.log(student.education);
        
        
    </script>
</body>
</html>
