<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>

    <h1>Operator</h1>


    <script>
        // assign operator =
        let name = "Kyaw Zin Aung";
        console.log(name);

        // addition operator +
        let number = 4 + 5;
        console.log(number);
        let fourFive = '4' + 5;
        console.log(fourFive);

        let number1 = 20000;
        let number2 = 10000;
        let number3 = number1 + number2;
        console.log(number3);

        let num = 10;
        // num = num + 1;
        num += 5;
        console.log(num);

        let numOne = 10;
        // numOne++;
        console.log(++numOne);
        console.log(numOne);


        // subtraction operator -

        let num2 = 10;
        num2 -= 5;
        console.log(num2);

        let num3 = 10;
        console.log(--num3);


        // multiplication operator *
        let num4 = 765646;
        // num4 *= 58767;
        num4 =  num4 * 58767;
        console.log(num4);

        //division operator /
        let num5 = 10;
        num5 = num5 / 2;
        console.log(num5);

        // remainder operator %
        let num6 = 234324234234;
        num6 = num6 % 234324;
        console.log(num6);

        //exponent operator **
        const num7 = 2;
        const num8 = 6;
        const num9 = num7 ** num8;
        console.log(num9);
        
        // presendence operator
        let reult = (4 + 5) - 2 * 5 / 2 % 3;
        console.log(reult);





    </script>
    
</body>
</html>
