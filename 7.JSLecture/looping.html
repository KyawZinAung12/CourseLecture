    <script>
        // for loop

        for(let i = 0; i < 10; i++){
            // document.write("<h3>Hello World "+ (i+1) + " </h3>");
            document.write(`<h3>Hello World ${i+1} </h3>`);
        }


        let laptopList = ['MacBook Pro','MacBook Air','MacBook' ,'Mac Mini','iMac'];

        // document.write("<h3>My laptop is " + laptopList[0] + "</h3>");
        // document.write(`<h3>My laptop is ${laptopList[0]}</h3>`);

                        
        for(let i = 0; i < laptopList.length; i++){
            document.write(`<h3> ${i+1}.My laptop is ${laptopList[i]}</h3>`);

        }


        // homework

        // user input ali

        //     document.write(`<h3> ${num} x ${i} = ${num * i}</h3>`);
        // }


        // *
        // **
        // ***
            // i = 3 3 < 3
        for(let i = 0; i < 3; i++){
                // k = 3  3 <= 2
            for(let k = 0; k <= i; k++){
                document.write(`*`);
            }
            document.write(`<br>`);

        }


        // homework

        // *****
        // ****
        // ***

        // *


        // while loop

        let number = parseInt(prompt("Enter a number"));

        // while(condition){
        //     // code
        //     // update
        // }
                // 100 < 100
        while(number < 100){
            document.write(`Your Number is While Loop ${number}<br>`);

            number+= 10;
        }

        
        // do while loop

        // do{
        //     // code
        //     // update
        // }while(condition)
        do{
            document.write(`Your Number is Do While Loop ${number}<br>`);


            number += 20;
        }while(number < 100);



    </script>
